services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barometer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barometer}
      POSTGRES_DB: ${POSTGRES_DB:-barometer}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate-db:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barometer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barometer}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-barometer}
    depends_on:
      db:
        condition: service_healthy

  init-db:
    build:
      context: .
      dockerfile: Dockerfile.init
    profiles: ["seed"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barometer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barometer}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-barometer}
    depends_on:
      migrate-db:
        condition: service_completed_successfully

volumes:
  postgres_data:
