[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-barometer"
version = "0.1.0"
description = "Digital Barometer FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "digital-barometer-db",
    "dishka>=1.4.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pytrends-modern>=0.2.5",
    "selenium>=4.20.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]

[tool.uv.sources]
digital-barometer-db = { path = "src/db", editable = true }
